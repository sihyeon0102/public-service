spring.application.name=public-service

spring.datasource.url=jdbc:mysql://localhost:13306/public_service
spring.datasource.username=public_user
spring.datasource.password=public1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Local monitoring: expose only health and metric endpoints.
management.endpoints.web.exposure.include=health,prometheus,metrics
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Local Redis-backed search cache. Cached data is disposable and expires automatically.
spring.data.redis.host=localhost
spring.data.redis.port=16379
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=1s
spring.cache.type=redis
spring.cache.cache-names=facilitySearch
spring.cache.redis.time-to-live=5m
spring.cache.redis.cache-null-values=false
